name: Build ARIA AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip ARIA_AI_Android_source.zip -d .

      - name: Build APK
        run: gradle -p ARIA_AI_Android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ARIA-AI-APK
          path: ARIA_AI_Android/app/build/outputs/apk/debug/app-debug.apk
